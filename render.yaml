databases:
  - name: workpilot-db
    databaseName: workpilot
    user: workpilot
    plan: free

services:
  - type: web
    name: workpilot-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && PYTHONPATH=backend alembic upgrade head
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: workpilot-api
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_SIGNUPS
        value: true
      - key: SIGNUP_INVITE_CODE
        sync: false

  - type: web
    name: workpilot-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
